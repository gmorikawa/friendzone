name: friendzone

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: friendzone-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "Friendzone123!"
    ports:
      - "5002:1433"
    volumes:
      - mnt-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: friendzone-sqlserver-setup
    depends_on:
      database:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: "Friendzone123!"
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint: /opt/mssql-tools18/bin/sqlcmd
    command: ["-S", "database", "-U", "sa", "-C", "-b", "-i", "/init.sql"]
    restart: "no"
  email:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "5003:8025" # Web UI (Access via browser)
      - "5004:1025" # SMTP Port (App connection)
    environment:
      TZ: Asia/Tokyo
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

      MP_UI_AUTH: true
      MP_UI_AUTH_FILE: /data/ui.auth

      MP_SMTP_AUTH: true
      MP_SMTP_AUTH_FILE: /data/mailpit.auth
      MP_SMTP_AUTH_ALLOW_INSECURE: true
    volumes:
      - mnt-mailpit:/data
      - ./docker/mailpit/smtp.auth:/data/mailpit.auth:ro
      - ./docker/mailpit/ui.auth:/data/ui.auth:ro

volumes:
  mnt-sqlserver:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${PWD}/data/sqlserver'
  mnt-mailpit:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${PWD}/data/mailpit'
